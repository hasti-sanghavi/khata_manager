const FILE_URL='YOUR_SUPABASE_URL';
const FILE_KEY='YOUR_SUPABASE_ANON_KEY';
const _g=k=>{try{const v=localStorage.getItem(k);if(v)return v}catch(e){}const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null};
const _s=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}try{document.cookie=k+'='+encodeURIComponent(v)+'; max-age=315360000; path=/; SameSite=Lax'}catch(e){}};
try{const p=new URLSearchParams(location.search);if(p.get('u')&&p.get('k')){_s('sb_url',p.get('u').trim());_s('sb_key',p.get('k').trim());history.replaceState(null,'',location.pathname)}}catch(e){}
const SUPABASE_URL=FILE_URL.startsWith('YOUR_')?(_g('sb_url')||FILE_URL):FILE_URL;
const SUPABASE_KEY=FILE_KEY.startsWith('YOUR_')?(_g('sb_key')||FILE_KEY):FILE_KEY;
const CONFIGURED=!SUPABASE_URL.startsWith('YOUR_');
const sb=CONFIGURED?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const mem={};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let db={accounts:[],entries:[],dues:[],duesAll:[]},uidv=null,sessEmail='',unlocked=false;
async function load(){
  const [a,e,d]=await Promise.all([sb.from('accounts').select('*').order('name'),sb.from('entries').select('*'),sb.from('dues').select('*')]);
  if(a.error||e.error||d.error){alert(t('saveErr')+' '+(a.error||e.error||d.error).message);return}
  db.accounts=a.data;
  db.entries=e.data.map(x=>({id:x.id,acc:x.account_id,type:x.type,amt:Number(x.amount),date:x.entry_date,note:x.note,files:x.files||[],kind:x.kind||'',qty:Number(x.qty)||0,unit:x.unit||'',rate:Number(x.rate)||0,ts:new Date(x.created_at).getTime()}));
  db.duesAll=d.data.map(x=>({id:x.id,acc:x.account_id,dir:x.dir,amt:Number(x.amount),date:x.due_date,note:x.note,paid:x.paid_on||''}));
  db.dues=db.duesAll.filter(x=>!x.paid);
}
const refresh=async()=>{await load();render()};
const okr=r=>{if(r.error){alert(t('saveErr')+' '+r.error.message);return false}return true};

function entryForm(id,type,kind){

// ---------- actions ----------
async function markPaid(did){const d=db.dues.find(x=>x.id===did);if(!d)return;
  const r=await sb.from('entries').insert({account_id:d.acc,type:d.dir==='receive'?'got':'gave',amount:d.amt,entry_date:today(),note:(d.dir==='receive'?t('recvNote'):t('paidNote'))+(d.note||t('dueNote')),files:[]});
  if(!okr(r))return;
  let u=await sb.from('dues').update({paid_on:today()}).eq('id',did);   // keeps history for payment behaviour
  if(u.error)u=await sb.from('dues').delete().eq('id',did);              // fallback if paid_on column is missing
  if(okr(u)){await logAct('due_done',acc(d.acc)?acc(d.acc).name:'',d.amt,'');await refresh()}}
async function delDue(id){const d=db.dues.find(x=>x.id===id);if(confirm(t('delDueQ'))&&okr(await sb.from('dues').delete().eq('id',id))){await logAct('due_del',d&&acc(d.acc)?acc(d.acc).name:'',d?d.amt:null,'');await refresh()}}
async function delEntry(id){if(!confirm(t('delEntryQ')))return;
  const e=db.entries.find(x=>x.id===id);
  if(okr(await sb.from('entries').delete().eq('id',id))){await logAct('entry_del',e&&acc(e.acc)?acc(e.acc).name:'',e?e.amt:null,e?(e.kind==='sale'?t('sale'):e.type==='gave'?t('dr'):t('cr')):'');
    if(e&&e.files.length)await sb.storage.from('documents').remove(e.files.map(f=>f.id));await refresh()}}
async function openFile(path,name){const r=await sb.storage.from('documents').createSignedUrl(path,300);
  if(r.error||!r.data)return alert(t('noFile'));
  const m=sheet(`<h1>${esc(name)}</h1><a href="${esc(r.data.signedUrl)}" target="_blank" rel="noopener"><button style="width:100%">${t('openFile')}</button></a><button class="o" style="width:100%;margin-top:10px" id="c">${t('close')}</button>`);
  m.querySelector('#c').onclick=()=>m.remove()}
boot();
</script></body></html>
