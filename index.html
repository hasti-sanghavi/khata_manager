const FILE_URL='YOUR_SUPABASE_URL';
const FILE_KEY='YOUR_SUPABASE_ANON_KEY';
const _g=k=>{try{const v=localStorage.getItem(k);if(v)return v}catch(e){}const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null};
const _s=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}try{document.cookie=k+'='+encodeURIComponent(v)+'; max-age=315360000; path=/; SameSite=Lax'}catch(e){}};
try{const p=new URLSearchParams(location.search);if(p.get('u')&&p.get('k')){_s('sb_url',p.get('u').trim());_s('sb_key',p.get('k').trim());history.replaceState(null,'',location.pathname)}}catch(e){}
const SUPABASE_URL=FILE_URL.startsWith('YOUR_')?(_g('sb_url')||FILE_URL):FILE_URL;
const SUPABASE_KEY=FILE_KEY.startsWith('YOUR_')?(_g('sb_key')||FILE_KEY):FILE_KEY;
const CONFIGURED=!SUPABASE_URL.startsWith('YOUR_');
const sb=CONFIGURED?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const mem={};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let db={accounts:[],entries:[],dues:[]},uidv=null;
async function load(){
  const [a,e,d]=await Promise.all([sb.from('accounts').select('*').order('name'),sb.from('entries').select('*'),sb.from('dues').select('*')]);
  if(a.error||e.error||d.error){alert(t('saveErr')+' '+(a.error||e.error||d.error).message);return}
  db.accounts=a.data;
  db.entries=e.data.map(x=>({id:x.id,acc:x.account_id,type:x.type,amt:Number(x.amount),date:x.entry_date,note:x.note,files:x.files||[],kind:x.kind||'',qty:Number(x.qty)||0,unit:x.unit||'',rate:Number(x.rate)||0,ts:new Date(x.created_at).getTime()}));
  db.dues=d.data.map(x=>({id:x.id,acc:x.account_id,dir:x.dir,amt:Number(x.amount),date:x.due_date,note:x.note}));
}
const refresh=async()=>{await load();render()};
const okr=r=>{if(r.error){alert(t('saveErr')+' '+r.error.message);return false}return true};

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString(lang==='gu'?'gu-IN':'en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

const bal=id=>db.entries.filter(e=>e.acc===id).reduce((s,e)=>s+(e.type==='gave'?e.amt:-e.amt),0);

let view={t:'home'};
function nav(v){view=v;render();scrollTo(0,0)}
// ---------- login ----------
let unlocked=false;
function lockScreen(){
  $('#app').innerHTML=`<div class="pin">${langBtn()}<div style="font-size:48px">📒</div><h1>${t('title')}</h1>
  <input id="em" type="email" autocomplete="username" placeholder="${t('email')}" style="letter-spacing:0;font-size:16px;text-align:left">
  <input id="pw" type="password" autocomplete="current-password" placeholder="${t('password')}" style="letter-spacing:0;font-size:16px;text-align:left">
  <p id="pe" class="out"></p><button id="go" style="width:100%">${t('login')}</button>
  ${FILE_URL.startsWith('YOUR_')?`<button id="rs" class="o s" style="margin-top:14px">${t('resetSetup')}</button>`:''}</div>`;
  const go=async()=>{let error;try{({error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}))}catch(e){error=e}
    if(error){$('#pe').textContent=/fetch|network|load failed/i.test(error.message||'')?t('netErr'):t('loginErr');return}
    try{await enter()}catch(e){$('#pe').textContent=t('netErr')}};

}
function resetCfg(){try{localStorage.removeItem('sb_url');localStorage.removeItem('sb_key')}catch(e){}document.cookie='sb_url=; max-age=0; path=/';document.cookie='sb_key=; max-age=0; path=/';location.reload()}
async function enter(){const {data}=await sb.auth.getSession();uidv=data.session.user.id;await load();unlocked=true;render()}
async function logout(){await sb.auth.signOut();unlocked=false;db={accounts:[],entries:[],dues:[]};render()}
async function boot(){
  document.documentElement.lang=lang;document.title=t('title');
  if(!CONFIGURED){$('#app').innerHTML=`<div class="pin">${langBtn()}<div style="font-size:48px">📒</div><p class="mut">${t('setupMsg')}</p>
    <label>${t('urlLbl')}</label><input id="su" placeholder="https://xxxx.supabase.co" style="letter-spacing:0;font-size:15px;text-align:left">
    <label>${t('keyLbl')}</label><input id="sk" placeholder="eyJ..." style="letter-spacing:0;font-size:15px;text-align:left">
    <button id="ss" style="width:100%">${t('save')}</button></div>`;
    $('#ss').onclick=()=>{const u=$('#su').value.trim().replace(/\/(rest|auth)\/v1.*$/,'').replace(/\/+$/,''),k=$('#sk').value.trim();if(!/^https:\/\/.+\.supabase\.co/.test(u)||k.length<20)return;_s('sb_url',u);_s('sb_key',k);location.reload()};return}
  try{const {data}=await sb.auth.getSession();

// ---------- screens ----------
function render(){
  if(!unlocked)return CONFIGURED?lockScreen():boot();

  if(vt==='home')h=home();else if(vt==='accounts')h=accounts();else if(vt==='acc')h=accDetail(view.id);else if(vt==='month')h=monthly();else if(vt==='log')h=logScreen();else if(vt==='more')h=more();

  const fab=(vt==='home'||vt==='accounts')?`<button class="fab" onclick="quickAdd()" aria-label="Add">+</button>`:'';
  $('#app').innerHTML=h+fab+`<div class="tabs">${tab('home',t('tHome'))}${tab('accounts',t('tAcc'))}${tab('month',t('tMonth'))}${tab('more',t('tMore'))}</div>`;

const unitName=u=>u==='roll'?t('roll'):t('mtr');
const isV=id=>acc(id)&&acc(id).kind==='vendor';
const vTag=a=>a.kind==='vendor'?` <span class="tag soon">${t('vtag')}</span>`:'';
function dueCard(d){const a=acc(d.acc);return `<div class="card"><div class="row"><div onclick="nav({t:'acc',id:'${d.acc}'})"><div class="b">${esc(a?.name)}${a?vTag(a):''}</div><div class="mut">${fd(d.date)} ${dueTag(d.date)}</div>${d.note?`<div class="mut">${esc(d.note)}</div>`:''}</div>

function home(){
  const loc=lang==='gu'?'gu-IN':'en-IN',cur=today().slice(0,7);
  const bs=db.accounts.map(a=>({a,b:bal(a.id)}));
  const recv=bs.filter(x=>x.b>0.004).sort((x,y)=>y.b-x.b),pay=bs.filter(x=>x.b<-0.004).sort((x,y)=>x.b-y.b);
  const tr=recv.reduce((s,x)=>s+x.b,0),tp=pay.reduce((s,x)=>s-x.b,0);
  const dues=[...db.dues].sort((a,b)=>a.date.localeCompare(b.date));
  const dr=dues.filter(d=>d.dir==='receive'),dp=dues.filter(d=>d.dir==='pay');
  const msum=(m,f)=>db.entries.filter(e=>e.date.startsWith(m)&&f(e)).reduce((s,e)=>s+e.amt,0);

  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return {k,l:d.toLocaleDateString(loc,{month:'short'}),s:msum(k,fS),r:msum(k,fR)}});

  <div style="display:flex;gap:8px;margin-top:4px">${months.map(m=>`<div class="mut" style="flex:1;text-align:center;font-size:12px">${m.l}</div>`).join('')}</div>
  <div class="mut" style="margin-top:6px;font-size:12px"><span style="color:var(--pri)">■</span> ${t('sales')} &nbsp; <span style="color:var(--in)">■</span> ${t('moneyIn')}</div>`;
  const hb=(rows,c)=>{const m=Math.max(1,...rows.map(x=>Math.abs(x.b)));return rows.slice(0,5).map(x=>`<div style="margin:10px 0" onclick="nav({t:'acc',id:'${x.a.id}'})"><div class="row"><span>${esc(x.a.name)}${vTag(x.a)}</span><span class="b ${c}">${inr(x.b)}</span></div><div style="height:6px;background:var(--bd);border-radius:3px;margin-top:3px"><div style="height:6px;width:${Math.abs(x.b)/m*100}%;background:var(--${c});border-radius:3px"></div></div></div>`).join('')||`<div class="empty">${t('nobody')}</div>`};
  const od=db.dues.filter(d=>daysTo(d.date)<0),odR=od.filter(d=>d.dir==='receive').reduce((s,d)=>s+d.amt,0),odP=od.filter(d=>d.dir==='pay').reduce((s,d)=>s+d.amt,0);
  const wk=db.dues.filter(d=>{const n=daysTo(d.date);return n>=0&&n<=7});
  const qb=(k,l)=>`<button class="o" style="padding:12px 4px;font-size:13px" onclick="pick('${k}')">${l}</button>`;
  const stat=(l,v,c,bg)=>`<div class="card" style="margin:0;background:var(--${bg})"><div class="mut">${l}</div><div class="b ${c}" style="font-size:20px">${inr(v)}</div></div>`;
  return `<h1>${t('hello')}</h1>
  <div class="mut" style="margin-bottom:6px">${t('qaTitle')}</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${qb('sale',t('newSale'))}${qb('in',t('payIn'))}${qb('out',t('payOut'))}${qb('bill',t('qBill'))}${qb('due',t('dueBtn'))}${qb('acc',t('newAccBtn'))}</div>
  <div class="sum" style="margin-top:12px">${stat(t('toRecv'),tr,'in','inbg')}${stat(t('toPay'),tp,'out','outbg')}${stat(t('monthSales'),msum(cur,fS),'','card')}${stat(t('monthIn'),msum(cur,fR),'in','card')}</div>
  ${od.length?`<div class="card" style="margin-top:8px;background:var(--outbg)"><div class="b out">⚠️ ${od.length} ${t('overdueT')}</div><div class="mut">${odR?t('toRecv')+' '+inr(odR):''} ${odP?' · '+t('toPay')+' '+inr(odP):''}</div></div>`:''}
  ${wk.length?`<div class="card" style="margin-top:8px"><div class="b">📅 ${t('next7')}: ${wk.length}</div></div>`:''}
  <h2>${t('trend')}</h2><div class="card">${trend}</div>
  <h2>${t('topOwe')}</h2><div class="card">${hb(recv,'in')}</div>
  <h2>${t('whomOwe')}</h2><div class="card">${hb(pay,'out')}</div>
  <h2>${t('dueRecv')}</h2>${dr.map(dueCard).join('')||`<div class="empty">${t('noDates')}</div>`}
  <h2>${t('duePay')}</h2>${dp.map(dueCard).join('')||`<div class="empty">${t('noDates')}</div>`}`;

let mon=today().slice(0,7);
function monthly(){
  const vend=id=>isV(id),inM=d=>(d||'').startsWith(mon),sum=a=>a.reduce((s,e)=>s+e.amt,0);
  const E=db.entries.filter(e=>inM(e.date));
  const sales=E.filter(e=>e.kind==='sale').sort((x,y)=>y.date.localeCompare(x.date));
  const recv=E.filter(e=>e.type==='got'&&!vend(e.acc)),paidV=E.filter(e=>e.type==='gave'&&vend(e.acc)),purch=E.filter(e=>e.type==='got'&&vend(e.acc));
  const vOwed=db.accounts.filter(a=>a.kind==='vendor').map(a=>({a,b:bal(a.id)})).filter(x=>x.b<-0.004).sort((x,y)=>x.b-y.b);

  const qm=sales.filter(e=>e.unit!=='roll').reduce((s,e)=>s+e.qty,0),qr=sales.filter(e=>e.unit==='roll').reduce((s,e)=>s+e.qty,0);

  <div class="sum">${card(t('sales'),sum(sales),'','card')}${card(t('moneyIn'),sum(recv),'in','inbg')}${card(t('purchases'),sum(purch),'','card')}${card(t('paidVendors'),sum(paidV),'out','outbg')}</div>
  <div class="mut" style="margin-top:6px">${qm?qm+' '+t('mtr'):''} ${qr?'· '+qr+' '+t('roll'):''}</div>
  <h2>${t('vendorsToPay')} · <span class="out">${inr(vOwed.reduce((s,x)=>s-x.b,0))}</span></h2>

}

    const kd=m.querySelector('#k').value,em=m.querySelector('#em2').value.trim();
    const row={name:n,kind:kd,phone:m.querySelector('#p').value,notes:m.querySelector('#no').value};
    if(kd==='vendor'&&(em||a.email))row.email=em;
    const r=id?await sb.from('accounts').update(row).eq('id',id):await sb.from('accounts').insert(row);
    if(!okr(r)){e.target.disabled=false;return}await logAct(id?'acc_edit':'acc_add',n);m.remove();await refresh()};
  if(id)m.querySelector('#d').onclick=async()=>{if(confirm(t('delAccQ'))){if(okr(await sb.from('accounts').delete().eq('id',id))){await logAct('acc_del',a.name);m.remove();view={t:'accounts'};await refresh()}}};
}
function entryForm(id,type,kind){
  const sale=kind==='sale',v=isV(id),nm=acc(id).name;
  const title=sale?t('newSale'):v?(type==='gave'?t('paidTitle'):t('billTitle')):(type==='gave'?t('gaveTitle'):t('gotTitle'));
  const fields=sale?`<label>${t('qty')}</label><input id="q" type="number" inputmode="decimal" step="any">
  <label>${t('unit')}</label><select id="u"><option value="meter">${t('mtr')}</option><option value="roll">${t('roll')}</option></select>
  <label id="rl">${t('rate',t('mtr'))}</label><input id="r" type="number" inputmode="decimal" step="any">
  <label>${t('final')}</label><input id="a" type="number" inputmode="decimal" step="any" style="font-weight:700">`
  :`<label>${t('amount')}</label><input id="a" type="number" inputmode="decimal" step="any">`;
  const m=sheet(`<h1>${title} — ${esc(nm)}</h1>${fields}
  <label>${t('date')}</label><input id="d" type="date" value="${today()}">
  <label>${t('dueOpt')}</label><input id="du" type="date">
  <div id="dab" style="display:none"><label>${t('dueAmt')}</label><input id="dua" type="number" inputmode="decimal" step="any"></div>
  <label>${sale?t('desc'):t('note')}</label><textarea id="no" rows="2" placeholder="${sale?'':t('notePh')}"></textarea>
  <label>${t('docs')}</label><input id="f" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
  <div class="btns"><button class="o" id="c">${t('cancel')}</button><button class="${type==='gave'?'r':'g'}" id="s">${t('save')}</button></div>`);
  const $m=x=>m.querySelector(x);let touched=false;
  const defDue=()=>{if(touched)return;const am=parseFloat($m('#a').value)||0;const incr=(type==='gave'&&!v)||(type==='got'&&v);let val=am;
    if(!incr){const after=bal(id)+(type==='gave'?am:-am),rem=v?-after:after;val=rem>0?Math.round(rem*100)/100:am}$m('#dua').value=am?val:''};
  $m('#dua').oninput=()=>{touched=true};$m('#a').addEventListener('input',defDue);
  $m('#du').onchange=()=>{$m('#dab').style.display=$m('#du').value?'block':'none';defDue()};
  if(sale){const calc=()=>{const qv=parseFloat($m('#q').value),rv=parseFloat($m('#r').value);if(qv>0&&rv>0){$m('#a').value=Math.round(qv*rv*100)/100;defDue()}};
    $m('#q').oninput=calc;$m('#r').oninput=calc;$m('#u').onchange=()=>{$m('#rl').textContent=t('rate',$m('#u').value==='roll'?t('roll'):t('mtr'));calc()}}
  $m('#c').onclick=()=>m.remove();
  $m('#s').onclick=async e=>{const amt=parseFloat($m('#a').value);if(!(amt>0))return;
    let qv=null,rv=null,uv=null;if(sale){qv=parseFloat($m('#q').value);rv=parseFloat($m('#r').value);uv=$m('#u').value;if(!(qv>0&&rv>0))return}
    e.target.disabled=true;
    const eid=crypto.randomUUID(),files=[],note=$m('#no').value.trim();
    for(const f of $m('#f').files){
      const ext=(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5)||'bin';
      const path=`${uidv}/${eid}/${uid()}.${ext}`;
      const u=await sb.storage.from('documents').upload(path,f,{contentType:f.type||undefined});
      if(!okr(u)){e.target.disabled=false;return}
      files.push({id:path,name:f.name});
    }
    const r=await sb.from('entries').insert({id:eid,account_id:id,type,amount:amt,entry_date:$m('#d').value||today(),note,files,kind:sale?'sale':'',qty:qv,unit:uv||'',rate:rv});
    if(!okr(r)){e.target.disabled=false;return}
    await logAct(sale?'sale_add':type==='gave'?'debit_add':'credit_add',nm,amt,note.slice(0,80));
    const du=$m('#du').value;
    if(du){const da=parseFloat($m('#dua').value)>0?parseFloat($m('#dua').value):amt;
      const dr=await sb.from('dues').insert({account_id:id,dir:v?'pay':'receive',amount:da,due_date:du,note:note.slice(0,80)});
      if(okr(dr))await logAct('due_add',nm,da,du)}
    m.remove();await refresh()};
}
function dueForm(id){
  const m=sheet(`<h1>${t('dueTitle')} — ${esc(acc(id).name)}</h1>
  <label>${t('type')}</label><select id="t"><option value="receive" ${isV(id)?'':'selected'}>${t('recvFrom')}</option><option value="pay" ${isV(id)?'selected':''}>${t('payTo')}</option></select>
  <label>${t('amount')}</label><input id="a" type="number" inputmode="decimal"><label>${t('dueDate')}</label><input id="d" type="date" value="${today()}"><label>${t('note')}</label><input id="no">
  <div class="btns"><button class="o" id="c">${t('cancel')}</button><button id="s">${t('save')}</button></div>`);
  m.querySelector('#c').onclick=()=>m.remove();
  m.querySelector('#s').onclick=async e=>{const amt=parseFloat(m.querySelector('#a').value);if(!(amt>0))return;e.target.disabled=true;
    const dt=m.querySelector('#d').value||today();
    const r=await sb.from('dues').insert({account_id:id,dir:m.querySelector('#t').value,amount:amt,due_date:dt,note:m.querySelector('#no').value.trim()});
    if(!okr(r)){e.target.disabled=false;return}await logAct('due_add',acc(id).name,amt,dt);m.remove();await refresh()};
}
// ---------- activity log ----------
async function logAct(action,name,amt,detail){try{await sb.from('activity_log').insert({action,account_name:name||'',amount:amt==null?null:amt,detail:detail||''})}catch(e){}}
function logScreen(){setTimeout(loadLog,0);return `<div class="row"><button class="o s" onclick="nav({t:'more'})">${t('back')}</button></div><h1>${t('logTitle')}</h1><div id="logl" class="empty">${t('loading')}</div>`}
async function loadLog(){const r=await sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(200);const el=$('#logl');if(!el)return;
  if(r.error){el.textContent=t('logErr');return}
  el.className='';el.innerHTML=r.data.map(l=>`<div class="card"><div class="b">${T['lg_'+l.action]?t('lg_'+l.action):esc(l.action)} ${l.amount!=null?inr(Number(l.amount)):''}</div><div class="mut">${esc(l.account_name)}${l.detail?' · '+esc(l.detail):''}</div><div class="mut">${new Date(l.created_at).toLocaleString(lang==='gu'?'gu-IN':'en-IN')}</div></div>`).join('')||`<div class="empty">${t('noLog')}</div>`}
// ---------- quick picker (home buttons) ----------
function pick(act){
  if(act==='acc')return accForm();
  const vend=act==='out'||act==='bill';
  const accs=db.accounts.filter(a=>act==='due'?true:vend?a.kind==='vendor':a.kind!=='vendor');
  if(!accs.length)return accForm(null,vend?'vendor':'client');
  const lbl={sale:t('newSale'),in:t('payIn'),out:t('payOut'),bill:t('qBill'),due:t('dueBtn')}[act];
  const m=sheet(`<h1>${lbl}</h1><input id="ps" placeholder="${t('search')}"><div id="pl"></div><button class="o" style="width:100%;margin-top:8px" id="pn">${t('newAccBtn')}</button>`);
  const paint=()=>{const qq=m.querySelector('#ps').value.toLowerCase();
    m.querySelector('#pl').innerHTML=accs.filter(a=>a.name.toLowerCase().includes(qq)).map(a=>`<div class="card row" data-id="${a.id}"><span class="b">${esc(a.name)}${vTag(a)}</span><span class="b ${bal(a.id)>0?'in':bal(a.id)<0?'out':'mut'}">${inr(bal(a.id))}</span></div>`).join('');
    m.querySelectorAll('#pl .card').forEach(c=>c.onclick=()=>{const id=c.dataset.id;m.remove();
      if(act==='sale')entryForm(id,'gave','sale');else if(act==='in'||act==='bill')entryForm(id,'got');else if(act==='out')entryForm(id,'gave');else dueForm(id)})};
  m.querySelector('#ps').oninput=paint;paint();m.querySelector('#pn').onclick=()=>{m.remove();accForm(null,vend?'vendor':'client')};
}
// ---------- actions ----------
async function markPaid(did){const d=db.dues.find(x=>x.id===did);if(!d)return;
  const r=await sb.from('entries').insert({account_id:d.acc,type:d.dir==='receive'?'got':'gave',amount:d.amt,entry_date:today(),note:(d.dir==='receive'?t('recvNote'):t('paidNote'))+(d.note||t('dueNote')),files:[]});
  if(!okr(r))return;if(okr(await sb.from('dues').delete().eq('id',did))){await logAct('due_done',acc(d.acc)?acc(d.acc).name:'',d.amt,'');await refresh()}}
async function delDue(id){const d=db.dues.find(x=>x.id===id);if(confirm(t('delDueQ'))&&okr(await sb.from('dues').delete().eq('id',id))){await logAct('due_del',d&&acc(d.acc)?acc(d.acc).name:'',d?d.amt:null,'');await refresh()}}
async function delEntry(id){if(!confirm(t('delEntryQ')))return;
  const e=db.entries.find(x=>x.id===id);
  if(okr(await sb.from('entries').delete().eq('id',id))){await logAct('entry_del',e&&acc(e.acc)?acc(e.acc).name:'',e?e.amt:null,e?(e.kind==='sale'?t('sale'):e.type==='gave'?t('dr'):t('cr')):'');
    if(e&&e.files.length)await sb.storage.from('documents').remove(e.files.map(f=>f.id));await refresh()}}
async function openFile(path,name){const r=await sb.storage.from('documents').createSignedUrl(path,300);
  if(r.error||!r.data)return alert(t('noFile'));window.open(r.data.signedUrl,'_blank')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='ledger-backup-'+today()+'.json';a.click()}
boot();
</script></body></html>
